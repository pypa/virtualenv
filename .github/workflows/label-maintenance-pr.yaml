name: Label maintenance PRs
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] The shared action reads PR metadata without checkout.
    types: [opened, reopened, synchronize]
permissions: {}
jobs:
  label:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@16fb799213df587849bcb78ea5ea00a29f750964
        with:
          fragments: docs/changelog
          extension: rst
