name: Label maintenance PRs
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] The shared action reads PR metadata without checkout.
    types: [opened, reopened, synchronize]
permissions: {}
jobs:
  label:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@24e7c78489b6e2adb7b8f881761a5c2dbfe03fee
        with:
          fragments: docs/changelog
          extension: rst
