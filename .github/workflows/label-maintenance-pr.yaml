name: Label maintenance PRs
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] The shared action reads PR metadata without checkout.
    types: [opened, reopened, synchronize]
permissions: {}
jobs:
  label:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@2b4ed19340a7ec97020f4fd0a403531845c49356
        with:
          fragments: docs/changelog
          extension: rst
