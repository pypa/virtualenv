name: 🧪 check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 8 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  test:
    name: 🧪 test ${{ matrix.py }} - ${{ matrix.os }} ${{ matrix.group }}
    if: github.event_name != 'schedule' || github.repository_owner == 'pypa'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.py == 'graalpy' && 20 || 40 }}
    permissions:
      contents: read
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # macOS ships a 3.9 that uv would pick over downloading one; the brew legs point UV_PYTHON at Homebrew's build
      UV_PYTHON_PREFERENCE: ${{ startsWith(matrix.py, 'brew@') && 'managed' || 'only-managed' }}
    strategy:
      fail-fast: false
      matrix:
        py:
          - "3.15t"
          - "3.15"
          - "3.14t"
          - "3.14"
          - "3.13t"
          - "3.13"
          - "3.12"
          - "3.11"
          - "3.10"
          - "3.9"
          - pypy-3.11
          - pypy-3.10
          - pypy-3.9
          - rp
        os:
          - ubuntu-24.04
          - macos-26
          - windows-2025-vs2026
        include:
          - {os: windows-2025-vs2026, py: "3.13t", diagnostics: true}
          - {os: macos-26, py: "3.13t", diagnostics: true}
          - {os: ubuntu-24.04, py: graalpy, group: "1/4"}
          - {os: ubuntu-24.04, py: graalpy, group: "2/4"}
          - {os: ubuntu-24.04, py: graalpy, group: "3/4"}
          - {os: ubuntu-24.04, py: graalpy, group: "4/4"}
          - {os: macos-26, py: graalpy, group: "1/4"}
          - {os: macos-26, py: graalpy, group: "2/4"}
          - {os: macos-26, py: graalpy, group: "3/4"}
          - {os: macos-26, py: graalpy, group: "4/4"}
          - {os: macos-26, py: "brew@3.14"}
          - {os: macos-26, py: "brew@3.13"}
          - {os: macos-26, py: "brew@3.12"}
          - {os: macos-26, py: "brew@3.11"}
          - {os: macos-26, py: "brew@3.10"}
        exclude:
          - {os: windows-2025-vs2026, py: "pypy-3.10"}
          - {os: windows-2025-vs2026, py: "pypy-3.9"}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🏷️ Fetch upstream tags for versioning
        shell: bash
        run: |
          git fetch --force --tags https://github.com/pypa/virtualenv.git
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          cache-suffix: ${{ matrix.py }}
          python-version: "3.15"
          activate-environment: true
      # apt and brew each hold a global lock, so each keeps its packages in one step; the rest download on their own
      - parallel:
          - name: 📦 Install tox with this virtualenv
            shell: bash
            env:
              MATRIX_PY: ${{ matrix.py }}
            run: |
              if [[ "$MATRIX_PY" == "3.13t" || "$MATRIX_PY" == "3.14t" || "$MATRIX_PY" == "3.15t" || "$MATRIX_PY" == "rp" ]]; then
                uv tool install --python-preference only-managed --python 3.15 "tox>=4.45" --with .
              else
                uv tool install --python-preference only-managed --python 3.15 "tox>=4.45" --with tox-uv --with .
              fi
          - name: 🐍 Setup Python for test ${{ matrix.py }}
            if: ${{ !startsWith(matrix.py, 'brew@') && matrix.py != 'rp' }}
            uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
            with:
              version: latest-known
              enable-cache: false
              python-version: ${{ matrix.py }}
              activate-environment: true
          - name: 🦀 Install RustPython
            if: matrix.py == 'rp'
            shell: bash
            env:
              GH_TOKEN: ${{ github.token }}
            run: tasks/install_ci_tool.sh rustpython
          - name: 📦 Install Nushell
            shell: bash
            env:
              GH_TOKEN: ${{ github.token }}
            run: tasks/install_ci_tool.sh nushell
          - name: 📦 Install fish
            if: runner.os != 'Windows'
            shell: bash
            env:
              GH_TOKEN: ${{ github.token }}
            run: tasks/install_ci_tool.sh fish
          - name: 📦 Install apt packages
            if: runner.os == 'Linux'
            shell: bash
            run: |
              retry() {
                local n=1
                while ! "$@"; do
                  if [ $n -ge 5 ]; then
                    echo "Command failed after $n attempts: $*" >&2
                    return 1
                  fi
                  echo "Attempt $n failed for: $*; retrying in 10s" >&2
                  n=$((n + 1))
                  sleep 10
                done
              }
              # no job installs from packages.microsoft.com, and its outages fail apt-get update for every job
              sudo find /etc/apt/sources.list.d -type f -exec grep -q packages.microsoft.com {} \; -delete
              retry sudo apt-get update -y
              retry sudo apt-get install csh tcsh zsh locales-all -y
          - name: 📦 Install brew packages
            if: runner.os == 'macOS'
            shell: bash
            env:
              MATRIX_PY: ${{ matrix.py }}
            run: |
              brew update
              if [[ "$MATRIX_PY" == brew@* ]]; then
                PY=$(echo "$MATRIX_PY" | cut -c 6-)
                brew list --versions "python@$PY" >/dev/null 2>&1 || brew install "python@$PY"
                echo "/usr/local/opt/python@$PY/libexec/bin" >>"${GITHUB_PATH}"
              fi
              brew install tcsh dash || brew upgrade tcsh dash
      - name: ⚙️ Pick environment to run
        shell: bash
        env:
          MATRIX_PY: ${{ matrix.py }}
        run: |
          py="$MATRIX_PY"
          if [[ "$py" == brew@* ]]; then
            brew_version="${py#brew@}"
            echo "UV_PYTHON=/opt/homebrew/bin/python${brew_version}" >> "$GITHUB_ENV"
            py="$brew_version"
          fi
          echo "TOXENV=$py" >> "$GITHUB_ENV"
          echo "Set TOXENV=$py"
      - name: 📦 Setup test suite
        run: tox run -vvvv --notest --skip-missing-interpreters false
      - name: 🧪 Verify pytest diagnostics
        if: matrix.diagnostics
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python_path=./.tox/3.13t/Scripts/python.exe
          else
            python_path=./.tox/3.13t/bin/python
          fi
          "$python_path" -m pytest tests/tasks/test_pytest_diagnostics.py -n 0 --basetemp=.tox/diagnostics-self-test
      - name: 🧪 Run test suite
        run: tox run --skip-pkg-install
        timeout-minutes: ${{ matrix.py == 'graalpy' && 17 || 30 }}
        env:
          GRAALPY_GROUP: ${{ matrix.group || '1/1' }}
          PYTEST_PLUGINS: ${{ matrix.diagnostics && 'tasks.pytest_diagnostics' || '' }}
          # --reruns lets a single test recover from a transient worker crash (see
          # pytest-rerunfailures' documented pytest-xdist crash-recovery support) instead of
          # failing the whole matrix leg; scoped to CI only so local runs still fail fast.
          # graalpy skips xdist: tasks/run_graalpy_tests.py runs one serial pytest process per
          # CPU instead, each on its own --shard slice of the tests. graalpy also dropped its
          # --timeout-method=thread override: that method spawns a watcher thread per test,
          # and GraalVM's Context.close() treats any Python-visible thread still alive as
          # fatal, crashing the job even after every test passed (see #3240). The default
          # signal-based method needs no such thread. --timeout=300 stays as a safety net.
          PYTEST_ADDOPTS: "-vv --durations=20 --reruns 2 --reruns-delay 2${{ matrix.py == 'graalpy' && ' --timeout=300' || '' }}"
          # If a worker process dies outright (seen on 3.13t/Windows with no Python-level
          # exception at all), this prints a native stack trace to stderr instead of nothing.
          PYTHONFAULTHANDLER: "1"
          CI_RUN: "yes"
          DIFF_AGAINST: HEAD
      - name: 📤 Store macOS crash reports
        if: always() && matrix.diagnostics && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-reports-${{ matrix.py }}-${{ matrix.os }}
          path: ~/Library/Logs/DiagnosticReports/
          if-no-files-found: ignore
          retention-days: 14
      - name: 📤 Store pytest diagnostics
        if: always() && matrix.diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hang-diagnostics-${{ matrix.py }}-${{ matrix.os }}
          path: |
            .tox/hang-diagnostics/
            .tox/diagnostics-self-test/**/diagnostics/*.log
            .tox/3.13t/log/
            .tox/junit.3.13t.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: 📤 Store coverage data
        id: coverage-upload
        # the artifact client retries HTTP errors but rethrows ETIMEDOUT and ECONNRESET on the first attempt
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.py }}-${{ matrix.os }}-${{ strategy.job-index }}
          # combined .coverage.<env> files and the per-process files of envs that do not combine them
          path: .tox/.coverage*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: 📤 Store coverage data after a network error
        if: steps.coverage-upload.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.py }}-${{ matrix.os }}-${{ strategy.job-index }}
          path: .tox/.coverage*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          overwrite: true
  coverage:
    name: 📊 Combine coverage
    needs: test
    if: github.event_name != 'schedule' || github.repository_owner == 'pypa'
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the sources the report reads
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          cache-suffix: coverage
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 "tox>=4.45" --with tox-uv
      - name: 📩 Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # one directory per test run: runs on different OSes write the same .coverage.<env> file name
          pattern: coverage-*
          path: ${{ runner.temp }}/coverage-data
      - name: 📊 Combine and report coverage
        run: tox run -e coverage -- "$RUNNER_TEMP"/coverage-data/*
      - name: 📊 Write the coverage summary
        run: .tox/coverage/bin/coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
        env:
          COVERAGE_FILE: .tox/.coverage
  check:
    name: 🔍 check ${{ matrix.tox_env }} - ${{ matrix.os }}
    if: github.event_name != 'schedule' || github.repository_owner == 'pypa'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025-vs2026
        tox_env:
          - dev
          - docs
          - property
          - fuzz
          - readme
          - tasks
          - type
          - type-3.9
          - upgrade
          - zipapp
        exclude:
          - {os: windows-2025-vs2026, tox_env: docs}
          - {os: windows-2025-vs2026, tox_env: fuzz}
          - {os: windows-2025-vs2026, tox_env: readme}
          - {os: windows-2025-vs2026, tox_env: tasks}
          - {os: windows-2025-vs2026, tox_env: type}
          - {os: windows-2025-vs2026, tox_env: type-3.9}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🏷️ Fetch upstream tags for versioning
        shell: bash
        run: |
          git fetch --force --tags https://github.com/pypa/virtualenv.git
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          cache-suffix: ${{ matrix.tox_env }}
      - parallel:
          - name: 📦 Install tox
            run: uv tool install --python-preference only-managed --python 3.15 "tox>=4.45" --with tox-uv
          - name: 📦 Install Nushell for the property tests
            if: matrix.tox_env == 'property' && runner.os == 'Linux'
            env:
              GH_TOKEN: ${{ github.token }}
            run: tasks/install_ci_tool.sh nushell
          - name: 📦 Install fish for the property tests
            if: matrix.tox_env == 'property' && runner.os == 'Linux'
            env:
              GH_TOKEN: ${{ github.token }}
            run: tasks/install_ci_tool.sh fish
          - name: 📦 Install apt packages for the property tests
            if: matrix.tox_env == 'property' && runner.os == 'Linux'
            run: |
              # no job installs from packages.microsoft.com, and its outages fail apt-get update for every job
              sudo find /etc/apt/sources.list.d -type f -exec grep -q packages.microsoft.com {} \; -delete
              sudo apt-get update -y
              sudo apt-get install -y tcsh zsh
      - name: 📦 Setup check suite
        run: tox run -vv --notest --skip-missing-interpreters false
        env:
          TOXENV: ${{ matrix.tox_env }}
      - name: 🧪 Run check suite
        run: tox run --skip-pkg-install
        env:
          TOXENV: ${{ matrix.tox_env }}
          UPGRADE_ADVISORY: ${{ matrix.tox_env == 'upgrade' && '1' || '' }}
  test-queries:
    name: 🧪 Test custom CodeQL queries
    if: github.event_name != 'schedule' || github.repository_owner == 'pypa'
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the queries and their test fixtures
      security-events: read # codeql-action needs it to reach its API endpoints
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🛡️ Initialize CodeQL
        id: codeql
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python
      - name: 🧪 Run query tests
        run: '"$CODEQL" test run .github/codeql/tests'
        env:
          CODEQL: ${{ steps.codeql.outputs.codeql-path }}
  semgrep:
    name: 🔍 Semgrep activation rules
    if: github.event_name != 'schedule' || github.repository_owner == 'pypa'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
      - name: 🔍 Run the semgrep hooks
        run: uvx --from pre-commit-uv pre-commit run semgrep --all-files
  all-checks-pass:
    name: 🚦 All checks pass
    # the gate shares the jobs' condition, so every job it needs has run and a skip counts as a failure
    if: ${{ !cancelled() && (github.event_name != 'schedule' || github.repository_owner == 'pypa') }} # codespell:ignore cancelled
    needs: [test, coverage, check, test-queries, semgrep]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: 🚦 Require all needed jobs to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(to_entries[]; .value.result == "success")' <<<"$NEEDS_JSON"
