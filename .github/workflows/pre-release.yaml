name: Pre-release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto
permissions: {}
jobs:
  prepare:
    uses: tox-dev/github-workflows/.github/workflows/prepare-towncrier-release.yaml@a32ce094895292b19eea422fc6500f1ef1ae8d5f
    permissions:
      contents: read
      pull-requests: read
    with:
      bump: ${{ inputs.bump }}
      changelog: docs/changelog.rst
      fragments: docs/changelog
      format: rst
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
