name: Pre-release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions: {}
jobs:
  changelog:
    name: Build changelog
    # the release commit fast-forwards main from the dispatched commit, so a branch ahead of main would land on main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the source and let setup-uv download uv with the job token
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Block outbound traffic outside the allowlist
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            files.pythonhosted.org:443 github.com:443 pypi.org:443 raw.githubusercontent.com:443 release-assets.githubusercontent.com:443 releases.astral.sh:443
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the locked version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          version-file: tasks/release-requirements.txt
          enable-cache: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install the locked release tooling
        run: |
          uv venv --python 3.15 --python-preference only-managed "$RUNNER_TEMP/release"
          uv pip sync --python "$RUNNER_TEMP/release" --require-hashes tasks/release-requirements.txt
      - name: Require a news fragment
        run: |
          if ! compgen -G 'docs/changelog/*.*.rst' > /dev/null; then
            echo '::error::add a docs/changelog/*.rst fragment before preparing a release'
            exit 1
          fi
      - name: Generate changelog, commit, and tag
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          "$RUNNER_TEMP/release/bin/python" tasks/release.py --version "$BUMP" --no-push
          echo "version=$(git describe --tags --exact-match)" >> "$GITHUB_OUTPUT"
      - name: Store the changelog
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-changelog
          path: docs/changelog.rst
          if-no-files-found: error
          retention-days: 1
  push:
    name: Push release commit and tag
    needs: changelog
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - name: Block outbound traffic outside the allowlist
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the changelog
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-changelog
          path: ${{ runner.temp }}/changelog
      - name: Validate and stage the changelog
        env:
          VERSION: ${{ needs.changelog.outputs.version }}
          CHANGELOG: ${{ runner.temp }}/changelog/changelog.rst
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the build job reported an invalid version: $VERSION"
            exit 1
          fi
          if ! grep -qE "^ v${VERSION//./\\.} \\(" "$CHANGELOG"; then
            echo "::error::the changelog has no section for $VERSION"
            exit 1
          fi
          git fetch origin main --quiet
          if [[ -n "$(git tag --list "$VERSION")" ]]; then
            echo "::error::$VERSION already exists"
            exit 1
          fi
          if ! git diff --quiet "$GITHUB_SHA" origin/main -- \
            docs/changelog.rst docs/changelog pyproject.toml tasks/release.py tasks/release-requirements.txt; then
            echo "::error::release inputs changed after changelog generation"
            exit 1
          fi
          git reset --hard origin/main
          mapfile -d '' candidates < <(git ls-files -z 'docs/changelog/*.rst')
          fragments=()
          for fragment in "${candidates[@]}"; do
            if [[ "$fragment" =~ ^docs/changelog/[0-9]+\. ]]; then
              if [[ ! "$fragment" =~ ^docs/changelog/[0-9]+\.(feature|bugfix|doc|deprecation|removal)\.rst$ ]]; then
                echo "::error::unexpected news fragment: $fragment"
                exit 1
              fi
              fragments+=("$fragment")
            fi
          done
          if (( ${#fragments[@]} == 0 )); then
            echo '::error::no news fragments to release'
            exit 1
          fi
          cp "$CHANGELOG" docs/changelog.rst
          git rm -- "${fragments[@]}"
          git add docs/changelog.rst
          git diff --cached --check
      - name: Mint release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: pypa
          repositories: virtualenv
          permission-contents: write
      - name: Push release commit and tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ needs.changelog.outputs.version }}
        run: |
          set -euo pipefail
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          gh auth setup-git --hostname github.com --force
          git push --atomic origin HEAD:main "refs/tags/$VERSION"
