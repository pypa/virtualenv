name: 🛡️ CodeQL
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 9 * * 2"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  # The custom pack holds Python queries only, so the Python analysis loads it and the actions analysis does not.
  python:
    name: 🛡️ Python
    uses: tox-dev/github-workflows/.github/workflows/codeql.yaml@bceb5c005e19823dc8835f536f53f172ae223927 # 6.5.0
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["python"]'
      config-file: ./.github/codeql/codeql-config.yml
      queries: +./.github/codeql/queries
  actions:
    name: 🛡️ Actions
    uses: tox-dev/github-workflows/.github/workflows/codeql.yaml@bceb5c005e19823dc8835f536f53f172ae223927 # 6.5.0
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["actions"]'
      config-file: ./.github/codeql/codeql-config.yml
      queries: ""
