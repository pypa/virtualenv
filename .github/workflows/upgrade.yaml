name: 📦 Upgrade embedded dependencies
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  generate:
    name: 📦 Upgrade embedded pip/setuptools/wheel
    if: github.repository_owner == 'pypa'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.upgrade.outputs.changed == 'true' && steps.age-check.outputs.skip == 'false' }}
      patch-artifact-id: ${{ steps.upload-patch.outputs.artifact-id }}
    steps:
      - name: 🛡️ Block outbound traffic outside the allowlist
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443 files.pythonhosted.org:443 github.com:443 pypi.org:443 raw.githubusercontent.com:443 registry.npmjs.org:443 release-assets.githubusercontent.com:443 releases.astral.sh:443
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false # the egress allowlist above blocks the cache service
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 "tox>=4.32" --with tox-uv
      - name: 🏷️ Fetch upstream tags for versioning
        run: git fetch --force --tags https://github.com/pypa/virtualenv.git
      - name: 📦 Pin the newest CI test tools
        id: ci-tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.15 python tasks/upgrade_ci_tools.py
      - name: 📦 Run upgrade
        id: upgrade
        env:
          UPGRADE_ADVISORY: "1"
          CI_TOOLS_OUTCOME: ${{ steps.ci-tools.outcome }}
        run: |
          tox run -e upgrade
          git add -- src/virtualenv/seed/wheels/embed THIRD-PARTY-NOTICES.md docs/changelog
          if [ "$CI_TOOLS_OUTCOME" = "success" ]; then
            git add -- tasks/ci-tools.json
          fi
          if ! git diff --cached --quiet; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
            echo "### Embedded dependency changes" >>"$GITHUB_STEP_SUMMARY"
            git diff --cached --stat >>"$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "### All embedded dependencies are up to date" >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: 🔍 Check PyPI release age
        if: steps.upgrade.outputs.changed == 'true'
        id: age-check
        run: |
          uv run --no-project --python 3.15 python tasks/check_wheel_age.py >> "$GITHUB_OUTPUT"
      - name: ⚙️ Prepare upgrade patch
        if: steps.upgrade.outputs.changed == 'true' && steps.age-check.outputs.skip == 'false'
        run: git diff --cached --binary --no-ext-diff --no-textconv > "$RUNNER_TEMP/upgrade.patch"
      - name: 📤 Store upgrade patch
        if: steps.upgrade.outputs.changed == 'true' && steps.age-check.outputs.skip == 'false'
        id: upload-patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-patch
          path: ${{ runner.temp }}/upgrade.patch
          if-no-files-found: error
          retention-days: 1
  validate:
    name: 🔍 Validate upgrade patch
    needs: generate
    if: needs.generate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      patch-sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 📩 Download upgrade patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.generate.outputs.patch-artifact-id }}
          path: ${{ runner.temp }}/upgrade-patch
      - name: 🔍 Validate and apply upgrade patch without write access
        run: python3 tasks/apply_upgrade_patch.py "$RUNNER_TEMP/upgrade-patch/upgrade.patch"
      - name: ⚙️ Record the validated patch digest
        id: digest
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/upgrade-patch/upgrade.patch" | cut -d ' ' -f1)" >>"$GITHUB_OUTPUT"
  publish:
    name: 🔀 Open upgrade PR
    needs: [generate, validate]
    if: needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    environment: upgrade
    permissions:
      actions: write # dispatch CI on the upgrade branch
      contents: write # let create-pull-request manage the upgrade branch
      pull-requests: write # open the upgrade pull request
    steps:
      - name: 🛡️ Block outbound traffic outside the allowlist
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 raw.githubusercontent.com:443 release-assets.githubusercontent.com:443 releases.astral.sh:443
      - name: 📥 Check out trusted generator revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true # zizmor: ignore[artipacked] create-pull-request pushes the generated branch
      - name: 📩 Download upgrade patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.generate.outputs.patch-artifact-id }}
          path: ${{ runner.temp }}/upgrade-patch
      - name: ⚙️ Apply the validated upgrade patch
        env:
          EXPECTED_SHA256: ${{ needs.validate.outputs.patch-sha256 }}
        run: |
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/upgrade-patch/upgrade.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/upgrade-patch/upgrade.patch"
          git apply "$RUNNER_TEMP/upgrade-patch/upgrade.patch"
      - name: 🔀 Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "Upgrade embedded dependencies"
          # the checkout pins github.sha, a detached HEAD, so the action cannot infer the base branch
          base: main
          branch: auto/upgrade-embedded-deps
          delete-branch: true
          title: "Upgrade embedded pip/setuptools/wheel and CI test tools"
          body: |
            Automated upgrade of embedded pip, setuptools, and wheel dependencies, of the GraalPy, RustPython and Nushell releases CI tests against, and of the Mermaid version the documentation loads.

            This PR was created automatically by the [upgrade workflow](https://github.com/${{ github.repository }}/actions/workflows/upgrade.yaml).
          labels: |
            dependencies
      - name: 🧪 Run CI on the upgrade branch
        if: steps.cpr.outputs.pull-request-number
        # events from GITHUB_TOKEN start no workflows, except workflow_dispatch, so the pull request gets no CI otherwise
        run: |
          gh workflow run check.yaml --ref auto/upgrade-embedded-deps
          gh workflow run codeql.yaml --ref auto/upgrade-embedded-deps
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
