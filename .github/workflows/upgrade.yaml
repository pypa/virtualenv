name: Upgrade embedded dependencies
on:
  schedule:
    - cron: "0 10 * * *" # daily at 10:00 UTC
    - cron: "0 11 * * 1" # Mondays at 11:00 UTC, after the daily run, to also bump the CI test tools
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  generate:
    name: Upgrade embedded pip/setuptools/wheel
    if: github.repository_owner == 'pypa'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.upgrade.outputs.changed == 'true' && steps.age-check.outputs.skip == 'false' }}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install tox
        run: uv tool install --python-preference only-managed --python 3.14 "tox>=4.32" --with tox-uv
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch upstream tags for versioning
        run: git fetch --force --tags https://github.com/pypa/virtualenv.git
      - name: Pin the newest CI test tools
        id: ci-tools
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * 1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tasks/upgrade_ci_tools.py
      - name: Run upgrade
        id: upgrade
        env:
          UPGRADE_ADVISORY: "1"
          CI_TOOLS_OUTCOME: ${{ steps.ci-tools.outcome }}
        run: |
          tox run -e upgrade
          # hold back releases younger than the seven days check_wheel_age.py demands of embedded wheels
          UV_EXCLUDE_NEWER="7 days" uv pip compile pyproject.toml --universal --python-version 3.9 --upgrade -o pylock.zipapp.toml
          git add -- src/virtualenv/seed/wheels/embed THIRD-PARTY-NOTICES.md docs/changelog pylock.zipapp.toml
          if [ "$CI_TOOLS_OUTCOME" = "success" ]; then
            git add -- tasks/ci-tools.json
          fi
          if ! git diff --cached --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "### Embedded dependency changes" >> "$GITHUB_STEP_SUMMARY"
            git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "### All embedded dependencies are up to date" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check PyPI release age
        if: steps.upgrade.outputs.changed == 'true'
        id: age-check
        run: |
          python tasks/check_wheel_age.py >> "$GITHUB_OUTPUT"
      - name: Prepare upgrade patch
        if: steps.upgrade.outputs.changed == 'true' && steps.age-check.outputs.skip == 'false'
        run: git diff --cached --binary --no-ext-diff --no-textconv > "$RUNNER_TEMP/upgrade.patch"
      - name: Store upgrade patch
        if: steps.upgrade.outputs.changed == 'true' && steps.age-check.outputs.skip == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upgrade-patch
          path: ${{ runner.temp }}/upgrade.patch
          if-no-files-found: error
          retention-days: 1
  publish:
    name: Open upgrade pull request
    needs: generate
    if: needs.generate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: upgrade
    permissions:
      contents: write # let create-pull-request manage the upgrade branch
      pull-requests: write # open the upgrade pull request
    steps:
      - name: Checkout trusted generator revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }} # zizmor: ignore[artipacked]
      - name: Download upgrade patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: upgrade-patch
          path: ${{ runner.temp }}/upgrade-patch
      - name: Validate and apply upgrade patch
        run: python tasks/apply_upgrade_patch.py "$RUNNER_TEMP/upgrade-patch/upgrade.patch"
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "Upgrade embedded dependencies"
          branch: auto/upgrade-embedded-deps
          delete-branch: true
          title: "Upgrade embedded pip/setuptools/wheel and CI test tools"
          body: |
            Automated upgrade of embedded pip, setuptools, and wheel dependencies, and of the RustPython and Nushell releases CI tests against.

            This PR was created automatically by the [upgrade workflow](https://github.com/${{ github.repository }}/actions/workflows/upgrade.yaml).
          labels: |
            dependencies
      - name: Rename changelog with PR number
        if: steps.cpr.outputs.pull-request-number
        run: |
          pr_number="${STEPS_CPR_OUTPUTS_PULL_REQUEST_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin auto/upgrade-embedded-deps
          git checkout -B auto/upgrade-embedded-deps FETCH_HEAD
          if [ ! -f docs/changelog/u.bugfix.rst ]; then
            exit 0
          fi
          mv docs/changelog/u.bugfix.rst "docs/changelog/${pr_number}.bugfix.rst"
          git add docs/changelog/
          git commit -m "Rename changelog to ${pr_number}.bugfix.rst"
          git push origin HEAD:auto/upgrade-embedded-deps
        env:
          STEPS_CPR_OUTPUTS_PULL_REQUEST_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
