name: 🔍 dependency review
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  review:
    name: 🔍 dependency review
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read the dependency graph diff between the base and head commits
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # an advisory of any severity in any manifest blocks the change: runtime dependencies run on every install,
          # and the release tooling lock runs in jobs that hold publish and attestation permissions
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          # the dependency graph files requirements lock files under runtime scope whatever they pin, so the license
          # policy runs on the built wheel and zipapp SBOMs instead; see tasks/license_policy.py
          license-check: false
