name: 🔍 dependency review
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  review:
    name: 🔍 dependency review
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read the dependency graph diff between the base and head commits
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # every virtualenv install runs the runtime dependencies, so an advisory of any severity blocks the change
          fail-on-severity: low
          # docs/development.rst limits the license policy to runtime dependencies; dev-only tools such as the
          # MPL-2.0 hypothesis stay out of scope
          fail-on-scopes: runtime
          # keep in sync with the licensing policy in docs/development.rst
          allow-licenses: MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, PSF-2.0, ISC, Unlicense
