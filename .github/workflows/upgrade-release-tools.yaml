name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@a32ce094895292b19eea422fc6500f1ef1ae8d5f
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      python-version: "3.15"
      exclude-newer-packages: |
        certifi=2026-10-20T02:25:00Z
        uv=2026-10-20T15:13:00Z
      check-workflow: check.yaml
      commit-message: "build(deps): refresh release lock"
      pull-request-title: "build(deps): refresh release tool lock"
      pull-request-body: |-
        Refresh the project lock across its runtime dependencies, groups, extras, and supported Python versions.
