name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@33db207c963ad07b8d2bff4099143593fd4100b2
    permissions:
      contents: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      build-requirements: |-
        Cython>=3.0
        setuptools>=80
      python-version: "3.15"
      exclude-newer-packages: |
        certifi=2026-10-20T02:25:00Z
        uv=2026-10-20T15:13:00Z
        release-creator=2026-10-22T13:51:56Z
      commit-message: "build(deps): refresh release lock"
      pull-request-title: "build(deps): refresh release tool lock"
      pull-request-body: |-
        Refresh the project lock across its runtime dependencies, groups, extras, and supported Python versions.
