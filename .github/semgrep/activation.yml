rules:
  - id: ps1-reads-virtual-env-prompt
    message: $NAME reads VIRTUAL_ENV_PROMPT, which bash and zsh decode on every draw; use the escaped _VIRTUAL_PROMPT
    languages: [bash]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern-inside: $NAME=...
          - pattern-inside: $NAME+=...
      - metavariable-regex:
          metavariable: $NAME
          regex: ^(PS1|PROMPT|_VIRTUAL_PROMPT)$
      # the parser keeps single-quoted text as one literal, so a deferred '${VIRTUAL_ENV_PROMPT-}' has no
      # expansion node to match
      - pattern-regex: \bVIRTUAL_ENV_PROMPT\b
  - id: ps1-before-prompt-escaping
    message: $NAME is set outside the if/else that escapes the prompt; move it below, or update this rule with the block
    languages: [bash]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: $NAME=...
          - pattern: $NAME+=...
      - metavariable-regex:
          metavariable: $NAME
          regex: ^(PS1|PROMPT)$
      - pattern-not: $NAME="${_OLD_VIRTUAL_PS1}"
      # spelled out arm by arm because dropping one or halving a backslash run is the regression to catch
      - pattern-not-inside: |
          if [ -n "${BASH_VERSION-}" ]; then
              ...
              _VIRTUAL_REST=${VIRTUAL_ENV_PROMPT}
              _VIRTUAL_PROMPT=
              while [ -n "${_VIRTUAL_REST}" ]; do
                  ...
                  case ${_VIRTUAL_CHAR} in
                      \\) _VIRTUAL_PROMPT="${_VIRTUAL_PROMPT}\\\\\\\\" ;;
                      \$ | \`) _VIRTUAL_PROMPT="${_VIRTUAL_PROMPT}\\${_VIRTUAL_CHAR}" ;;
                      *) _VIRTUAL_PROMPT="${_VIRTUAL_PROMPT}${_VIRTUAL_CHAR}" ;;
                  esac
              done
              unset _VIRTUAL_REST _VIRTUAL_CHAR
          else
              ...
              psvar[9]="${VIRTUAL_ENV_PROMPT}"
              _VIRTUAL_PROMPT='%9v'
          fi
          ...
