version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - dependencies
      - github_actions
      - skip news
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/"
    labels:
      - dependencies
      - skip news
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      runtime-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "pre-commit"
    directory: "/"
    labels:
      - dependencies
      - skip news
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
