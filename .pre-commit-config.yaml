ci:
  autoupdate_schedule: quarterly
  # pre-commit.ci caps a hook environment at 250 MiB and semgrep's takes 346 MiB, so check.yaml runs these hooks
  skip: [semgrep]
default_language_version:
  python: python3.14
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0494aa7fa1314e98913a41227d8f0a515b2c1049" # frozen: 0.38.2
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell
        args: ["--write-changes"]
  - repo: https://github.com/tox-dev/tox-toml-fmt
    rev: "5125f601c3e134347288c3d42f3b34298b7cf1be" # frozen: v1.11.1
    hooks:
      - id: tox-toml-fmt
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "50e0f3aee9dc5747a5f173f79a7417403c18dda6" # frozen: v2.30.3
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "38bfb07c0c64c304f47eb52090f8288150c77730" # frozen: v0.17.1
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: ["--fix", "--unsafe-fixes", "--exit-non-zero-on-fix"]
  - repo: https://github.com/google/yamlfmt
    rev: "21ca5323a9c87ee37a434e0ca908efc0a89daa07" # frozen: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/hukkin/mdformat
    rev: 82912cdaea4fb830f751504486a7879c70526547 # frozen: 1.0.0
    hooks:
      - id: mdformat
        args: ["--wrap", "120"]
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-ruff==0.1.3
  - repo: https://github.com/LilSpazJoekp/docstrfmt
    rev: c1813841673cdcd6cf602dde1edb78a5d5e45235 # frozen: v2.2.1
    hooks:
      - id: docstrfmt
        args: ["-l", "120", "--preserve-adornments"]
        additional_dependencies: ["sphinx==9.1.1"]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
  - repo: https://github.com/crate-ci/typos
    rev: 7f9d0819ca1c008ade73f4b41fa9d258d48f605b # frozen: v1.51.1
    hooks:
      - id: typos
        exclude: |
          (?x)
          ^pylock[.]toml$  # Generated package names are not project prose.
  - repo: https://github.com/semgrep/pre-commit
    rev: dfdeebdd309a043859ba33a555839911e7b11801 # frozen: v1.182.1
    hooks:
      - id: semgrep
        name: semgrep activation rules
        args:
          - --config
          - .github/semgrep/activation.yml
          - --error
          - --quiet
          - --disable-version-check
          - src/virtualenv/activation/bash/activate.sh
        files: '^(\.github/semgrep/activation\.yml|src/virtualenv/activation/bash/activate\.sh)$'
        pass_filenames: false
      - id: semgrep
        alias: semgrep-test
        name: semgrep activation rule tests
        args: ["--test", "--quiet", "--disable-version-check", ".github/semgrep"]
        files: '^\.github/semgrep/'
        pass_filenames: false
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
